name: mobile-release

on:
  push:
    branches: [release/android]

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm i -g npm@12
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build-submit:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm i -g npm@12
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build and submit to Play internal testing
        run: eas build --profile production --platform android --non-interactive --auto-submit --json > build.json
      - name: Tag the build
        run: |
          tag="android/v$(jq -r '.[0].appVersion' build.json)+$(jq -r '.[0].appBuildVersion' build.json)"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
